<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>校園無人機群飛 AI 編排教室 2.0</title>
  <script src="https://cdn.plot.ly/plotly-2.29.0.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-dark: #090d16;
      --sidebar-bg: #111827;
      --card-bg: #1e293b;
      --border-color: #334155;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", Helvetica, Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* 側邊控制欄 */
    .sidebar {
      width: 410px;
      min-width: 410px;
      background: var(--sidebar-bg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-right: 1px solid var(--border-color);
      overflow-y: auto;
      z-index: 10;
    }
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    .header-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }
    .sidebar h2 {
      font-size: 1.15rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-v2 {
      font-size: 0.7rem;
      background: #0369a1;
      color: #e0f2fe;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    input, textarea, select {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    textarea {
      resize: vertical;
      min-height: 100px;
      line-height: 1.45;
      font-family: inherit;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* 伺服器切換器 */
    .server-row {
      display: flex;
      gap: 6px;
    }
    .server-row input { flex: 1; }
    .btn-pill {
      background: #1e293b;
      border: 1px solid var(--border-color);
      color: var(--accent);
      font-size: 0.72rem;
      padding: 0 8px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-pill:hover { background: #334155; }

    /* 按鈕樣式 */
    button.submit-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    button.submit-btn:hover { background: var(--primary-hover); }
    button.submit-btn:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #1e293b;
      color: var(--accent);
      border: 1px solid var(--border-color);
      padding: 7px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-secondary:hover { background: #334155; }

    .image-upload-box {
      border: 1px dashed #475569;
      border-radius: 6px;
      padding: 10px;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .image-upload-box input[type="file"] {
      border: none;
      padding: 2px 0;
      font-size: 0.8rem;
    }

    .status-msg {
      font-size: 0.84rem;
      padding: 8px 12px;
      border-radius: 6px;
      display: none;
      line-height: 1.4;
      word-break: break-word;
    }
    .status-msg.info { background: #075985; color: #e0f2fe; display: block; }
    .status-msg.error { background: #991b1b; color: #fee2e2; display: block; }
    .status-msg.success { background: #166534; color: #dcfce7; display: block; }

    /* 匯出管理區 */
    .export-box {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .export-box button {
      flex: 1;
      font-size: 0.78rem;
      padding: 6px;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      cursor: pointer;
    }
    .export-box button:hover {
      background: #334155;
      color: var(--text-main);
    }

    /* 主要畫布區 */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg-dark);
    }
    #plot-area {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    /* HUD 抬頭顯示 */
    .scene-hud {
      position: absolute;
      top: 18px;
      left: 24px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 9px 18px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      z-index: 20;
      pointer-events: none;
      transition: all 0.3s ease;
    }
    .scene-hud .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }
    .scene-hud .hud-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: 0.5px;
    }
    .scene-hud .hud-badge {
      font-size: 0.75rem;
      background: var(--primary);
      color: #fff;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
    }

    /* 底部時間軸工具列 */
    .timeline-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 20;
    }
    .btn-ctrl {
      background: #1e293b;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-ctrl:hover { background: #334155; }
    .btn-ctrl.active {
      background: var(--primary);
      border-color: var(--accent);
    }
    .slider-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      cursor: pointer;
    }
    select.speed-select {
      background: #1e293b;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 側邊劇本工作台 -->
  <div class="sidebar">
    <div class="header-box">
      <h2>🛸 無人機群飛劇本工作台</h2>
      <span class="badge-v2">v2.0</span>
    </div>

    <!-- 伺服器網址 -->
    <div class="form-group">
      <label>伺服器網址</label>
      <div class="server-row">
        <input type="text" id="serverUrl" value="http://localhost:8000" />
        <button class="btn-pill" onclick="switchServer('render')" title="切換為雲端伺服器">雲端</button>
        <button class="btn-pill" onclick="switchServer('local')" title="切換為本機伺服器">本機</button>
      </div>
    </div>

    <!-- Gemini API Key (可選) -->
    <div class="form-group">
      <label>Gemini API Key (自訂或留空使用後端預設)</label>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy... (選填)" />
    </div>

    <div class="row-2">
      <div class="form-group">
        <label>座號 / 姓名</label>
        <input type="text" id="studentName" value="113翁衝衝" />
      </div>
      <div class="form-group">
        <label>無人機總架數</label>
        <input type="number" id="droneCount" value="600" min="10" max="1500" onchange="updateInsertSceneOptions()" />
      </div>
    </div>

    <div class="form-group">
      <label>🎯 軌跡追蹤指定 (all、1、1-10 或 1,5,10)</label>
      <input type="text" id="trackDroneInput" value="all" onchange="renderAtProgress(currentGlobalProgress)" />
    </div>

    <!-- 圖片轉無人機 -->
    <div class="form-group">
      <label>🖼️ 圖片轉無人機 (模式與插入幕次)</label>
      <div class="image-upload-box">
        <input type="file" id="imageInput" accept="image/*" />
        <select id="imageModeSelect">
          <option value="pixel">🌟 實心彩色像素模式 (圖騰/相片/彩圖)</option>
          <option value="skeleton">✏️ 線條骨架模式 (菱形紋/簡筆畫/線條)</option>
        </select>
        <select id="insertSceneSelect">
          <option value="end">插入為：劇本最後一幕</option>
        </select>
        <button class="btn-secondary" onclick="convertAndInsertImage()">➕ 轉為點陣並寫入指定劇幕</button>
      </div>
    </div>

    <!-- 群飛劇本 -->
    <div class="form-group">
      <label>群飛劇本（逐幕描述）</label>
      <textarea id="promptInput" oninput="updateInsertSceneOptions()">第一幕：地面起飛
第二幕：泰雅祖靈之眼，雙層紅色與純白菱形光芒，中間深邃立體錯開
第三幕：排成大字「百步蛇」，由黑轉暗紅漸層，前後立體錯開
第四幕：展開為五彩太陽光環</textarea>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="requestDroneShow()">
      ✨ 送出劇本並生成 3D 燈光秀
    </button>

    <div id="statusBox" class="status-msg"></div>

    <!-- 匯出功能 -->
    <div class="export-box">
      <button onclick="exportShowJSON()">📥 匯出大秀 (JSON)</button>
      <button onclick="exportWaypointsCSV()">📊 匯出飛控座標 (CSV)</button>
    </div>
  </div>

  <!-- 3D 視覺畫布與時間軸 -->
  <div class="main-content">
    <div class="scene-hud" id="sceneHud" style="display: none;">
      <div class="dot"></div>
      <div class="hud-title" id="hudTitle">第一幕：地面起飛</div>
      <div class="hud-badge" id="hudBadge">已就定位</div>
    </div>

    <div id="plot-area"></div>

    <div class="timeline-bar">
      <button class="btn-ctrl active" id="playBtn" onclick="togglePlay()">▶ 播放大秀</button>
      <button class="btn-ctrl" onclick="stepScene(-1)" title="上一幕">⏮</button>
      <button class="btn-ctrl" onclick="stepScene(1)" title="下一幕">⏭</button>
      <button class="btn-ctrl active" id="trailBtn" onclick="toggleTrails()">🌐 軌跡: 顯示</button>

      <div class="slider-container">
        <div class="slider-labels">
          <span id="curProgressText">第 1 幕</span>
          <span id="totalScenesText">共 4 幕</span>
        </div>
        <input type="range" id="timelineSlider" min="0" max="1000" value="0" oninput="onSliderDrag(this.value)" />
      </div>

      <select class="speed-select" id="speedSelect" onchange="updateSpeed(this.value)">
        <option value="0.5">0.5x</option>
        <option value="1.0" selected>1.0x</option>
        <option value="1.5">1.5x</option>
        <option value="2.0">2.0x</option>
      </select>
    </div>
  </div>

  <script>
    let showScenes = [];
    let customImageScenes = {};
    let isPlaying = false;
    let showTrails = true;
    let currentGlobalProgress = 0.0;
    let playbackSpeed = 1.0;
    const BASE_TRANSITION_SECONDS = 3.5;
    const BASE_DWELL_SECONDS = 2.0;
    let lastTimestamp = null;
    let animationFrameId = null;

    // 自動判斷後端伺服器網址
    const hostname = window.location.hostname;
    const serverInput = document.getElementById("serverUrl");
    if (hostname === "localhost" || hostname === "127.0.0.1") {
      serverInput.value = window.location.origin;
    } else if (hostname.endsWith("onrender.com")) {
      serverInput.value = window.location.origin;
    } else {
      // 若是在 GitHub Pages (github.io) 或本地檔案 (file://) 開啟，預設連線至 Render 雲端後端
      serverInput.value = "https://droneserver-69c9.onrender.com";
    }

    function switchServer(mode) {
      const input = document.getElementById("serverUrl");
      if (mode === "render") {
        input.value = "https://droneserver-69c9.onrender.com";
      } else {
        input.value = "http://localhost:8000";
      }
    }

    function updateSpeed(val) {
      playbackSpeed = parseFloat(val) || 1.0;
    }

    // 初始化 Plotly 3D 場景
    function initPlotly() {
      const layout = {
        paper_bgcolor: "#090d16",
        plot_bgcolor: "#090d16",
        margin: { l: 0, r: 0, b: 0, t: 30 },
        scene: {
          xaxis: { title: "X (米)", range: [-7, 7], color: "#64748b", gridcolor: "#1e293b", zerolinecolor: "#334155" },
          yaxis: { title: "Y 深度 (米)", range: [1.5, 6.5], color: "#64748b", gridcolor: "#1e293b", zerolinecolor: "#334155" },
          zaxis: { title: "Z 高度 (米)", range: [0, 7.5], color: "#64748b", gridcolor: "#1e293b", zerolinecolor: "#334155" },
          aspectmode: "manual",
          aspectratio: { x: 1.4, y: 1.0, z: 1.0 },
          camera: { eye: { x: 0.0, y: -2.3, z: 0.4 } }
        },
        showlegend: false
      };

      const trajectoryTrace = {
        type: "scatter3d",
        mode: "lines",
        x: [0], y: [4], z: [0],
        line: { color: "rgba(56, 189, 248, 0.4)", width: 2.0 },
        hoverinfo: "none"
      };

      const droneTrace = {
        type: "scatter3d",
        mode: "markers",
        x: [0], y: [4], z: [0],
        marker: { size: 3.5, color: "#38bdf8", opacity: 0.95 }
      };

      Plotly.newPlot("plot-area", [trajectoryTrace, droneTrace], layout, { responsive: true, displayModeBar: true });
    }
    initPlotly();

    // 更新劇本下拉選單
    function updateInsertSceneOptions() {
      const promptInput = document.getElementById("promptInput");
      const insertSelect = document.getElementById("insertSceneSelect");
      const lines = promptInput.value.trim().split("\n").filter(l => l.trim());
      
      const currentVal = insertSelect.value;
      insertSelect.innerHTML = `<option value="end">插入為：劇本最後一幕 (第 ${lines.length + 1} 幕)</option>`;

      for (let i = 2; i <= lines.length + 1; i++) {
        const opt = document.createElement("option");
        opt.value = i.toString();
        opt.innerText = `插入為：第 ${i} 幕`;
        insertSelect.appendChild(opt);
      }
      insertSelect.value = currentVal;
    }
    updateInsertSceneOptions();

    // 解析追蹤無人機字串
    function getTrackedDroneSet(totalDrones) {
      const inputStr = (document.getElementById("trackDroneInput").value || "").trim().toLowerCase();
      if (!inputStr || inputStr === "all") return null;

      const tracked = new Set();
      const parts = inputStr.split(/[,，\s]+/);

      for (let p of parts) {
        if (p.includes("-")) {
          const [startStr, endStr] = p.split("-");
          const s = parseInt(startStr);
          const e = parseInt(endStr);
          if (!isNaN(s) && !isNaN(e)) {
            for (let i = Math.min(s, e); i <= Math.max(s, e); i++) {
              if (i >= 1 && i <= totalDrones) tracked.add(i - 1);
            }
          }
        } else {
          const num = parseInt(p);
          if (!isNaN(num) && num >= 1 && num <= totalDrones) {
            tracked.add(num - 1);
          }
        }
      }
      return tracked;
    }

    // 貪婪最近鄰配對（最小化航行總距離）
    function optimizePairings(fromPts, toPts) {
      const n = Math.min(fromPts.length, toPts.length);
      const usedTo = new Set();
      const matchedTo = new Array(n);

      for (let i = 0; i < n; i++) {
        const fp = fromPts[i];
        let bestDist = Infinity;
        let bestIdx = -1;

        for (let j = 0; j < n; j++) {
          if (usedTo.has(j)) continue;
          const tp = toPts[j];
          const distSq = (fp.x - tp.x) ** 2 + (fp.y - tp.y) ** 2 + (fp.z - tp.z) ** 2;
          if (distSq < bestDist) {
            bestDist = distSq;
            bestIdx = j;
          }
        }

        if (bestIdx !== -1) {
          usedTo.add(bestIdx);
          matchedTo[i] = toPts[bestIdx];
        } else {
          matchedTo[i] = toPts[i] || fp;
        }
      }
      return matchedTo;
    }

    function toggleTrails() {
      showTrails = !showTrails;
      const btn = document.getElementById("trailBtn");
      if (showTrails) {
        btn.innerText = "🌐 軌跡: 顯示";
        btn.classList.add("active");
      } else {
        btn.innerText = "🚫 軌跡: 隱藏";
        btn.classList.remove("active");
        Plotly.restyle("plot-area", { x: [[0]], y: [[4]], z: [[0]] }, [0]);
      }
      renderAtProgress(currentGlobalProgress);
    }

    function updateHUD(sceneIdx, isArrived) {
      const hud = document.getElementById("sceneHud");
      const title = document.getElementById("hudTitle");
      const badge = document.getElementById("hudBadge");
      
      if (!showScenes || showScenes.length === 0) {
        hud.style.display = "none";
        return;
      }

      hud.style.display = "flex";
      const scene = showScenes[sceneIdx];
      title.innerText = `第 ${sceneIdx + 1} 幕：${scene.name || "隊形變換"}`;
      
      if (isArrived) {
        badge.innerText = "✓ 已就定位";
        badge.style.background = "#16a34a";
      } else {
        badge.innerText = "✈ 立體防撞過渡中...";
        badge.style.background = "#0284c7";
      }
    }

    // 依進度渲染 3D 畫面
    function renderAtProgress(progress) {
      if (!showScenes || showScenes.length === 0) return;

      const totalTransitions = Math.max(1, showScenes.length - 1);
      const clampedProg = Math.max(0, Math.min(progress, totalTransitions));

      const fromIdx = Math.floor(clampedProg);
      const toIdx = Math.min(fromIdx + 1, totalTransitions);
      const t = clampedProg - fromIdx;

      const fromPts = showScenes[fromIdx].points || [];
      const toPts = showScenes[toIdx].points || [];
      const droneCount = Math.min(fromPts.length, toPts.length);

      const trackedSet = getTrackedDroneSet(droneCount);

      const curX = [];
      const curY = [];
      const curZ = [];
      const curColors = [];
      const curSizes = [];

      const trajX = [];
      const trajY = [];
      const trajZ = [];

      // 三次平滑過渡
      const smoothT = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
      const isArrived = (t === 0.0 || t >= 0.98);
      const arcFactor = Math.sin(t * Math.PI);

      for (let i = 0; i < droneCount; i++) {
        const fp = fromPts[i];
        const tp = toPts[i];

        const x = fp.x + (tp.x - fp.x) * smoothT;
        const z = fp.z + (tp.z - fp.z) * smoothT;

        const directionSign = (tp.x >= fp.x) ? 1.0 : -1.0;
        const indexOffset = ((i % 5) - 2) * 0.25;
        const yBypass = (directionSign * 0.8 + indexOffset) * arcFactor;

        const baseY = fp.y + (tp.y - fp.y) * smoothT;
        const y = baseY + (isArrived ? 0.0 : yBypass);

        curX.push(x);
        curY.push(y);
        curZ.push(z);

        const isTracked = (trackedSet === null || trackedSet.has(i));
        
        if (trackedSet !== null && isTracked) {
          curColors.push("#FF007F"); // 高亮桃紅
          curSizes.push(5.5);
        } else if (trackedSet !== null && !isTracked) {
          curColors.push("rgba(148, 163, 184, 0.3)");
          curSizes.push(2.5);
        } else {
          curColors.push(t < 0.5 ? (fp.color || "#38bdf8") : (tp.color || "#38bdf8"));
          curSizes.push(3.5);
        }

        if (showTrails && !isArrived && isTracked) {
          const midY = (fp.y + tp.y) / 2.0 + (directionSign * 0.8 + indexOffset);
          trajX.push(fp.x, (fp.x + tp.x) / 2.0, tp.x, null);
          trajY.push(fp.y, midY, tp.y, null);
          trajZ.push(fp.z, (fp.z + tp.z) / 2.0, tp.z, null);
        }
      }

      try {
        Plotly.restyle("plot-area", {
          x: [trajX.length > 0 ? trajX : [0]],
          y: [trajY.length > 0 ? trajY : [4]],
          z: [trajZ.length > 0 ? trajZ : [0]],
          "line.color": trackedSet !== null ? "#FF007F" : "rgba(56, 189, 248, 0.35)",
          "line.width": trackedSet !== null ? 2.8 : 1.2
        }, [0]);

        Plotly.restyle("plot-area", {
          x: [curX],
          y: [curY],
          z: [curZ],
          "marker.color": [curColors],
          "marker.size": [curSizes]
        }, [1]);
      } catch (e) {
        console.error("Restyle error:", e);
      }

      const slider = document.getElementById("timelineSlider");
      slider.value = (clampedProg / totalTransitions) * 1000;
      
      const activeSceneIdx = t >= 0.98 ? toIdx : fromIdx;
      document.getElementById("curProgressText").innerText = `第 ${activeSceneIdx + 1} 幕 (${Math.round((clampedProg / totalTransitions) * 100)}%)`;
      updateHUD(activeSceneIdx, isArrived);
    }

    // 動畫循環
    function animationLoop(timestamp) {
      if (!isPlaying) return;

      if (!lastTimestamp) lastTimestamp = timestamp;
      const dt = (timestamp - lastTimestamp) / 1000.0;
      lastTimestamp = timestamp;

      const totalTransitions = Math.max(1, showScenes.length - 1);
      const transitionDuration = BASE_TRANSITION_SECONDS / playbackSpeed;
      const dwellDuration = BASE_DWELL_SECONDS / playbackSpeed;
      const speed = 1.0 / (transitionDuration + dwellDuration);

      currentGlobalProgress += dt * speed * totalTransitions;

      if (currentGlobalProgress >= totalTransitions) {
        currentGlobalProgress = totalTransitions;
        renderAtProgress(currentGlobalProgress);
        pausePlay();
        return;
      }

      renderAtProgress(currentGlobalProgress);
      animationFrameId = requestAnimationFrame(animationLoop);
    }

    function togglePlay() {
      if (isPlaying) {
        pausePlay();
      } else {
        startPlay();
      }
    }

    function startPlay() {
      if (!showScenes || showScenes.length === 0) return;
      if (currentGlobalProgress >= showScenes.length - 1) {
        currentGlobalProgress = 0.0;
      }
      isPlaying = true;
      lastTimestamp = null;
      document.getElementById("playBtn").innerText = "⏸ 暫停";
      document.getElementById("playBtn").classList.add("active");
      animationFrameId = requestAnimationFrame(animationLoop);
    }

    function pausePlay() {
      isPlaying = false;
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
      document.getElementById("playBtn").innerText = "▶ 播放大秀";
      document.getElementById("playBtn").classList.remove("active");
    }

    function stepScene(delta) {
      if (!showScenes || showScenes.length === 0) return;
      pausePlay();
      const currentIdx = Math.round(currentGlobalProgress);
      const targetIdx = Math.max(0, Math.min(showScenes.length - 1, currentIdx + delta));
      currentGlobalProgress = targetIdx;
      renderAtProgress(currentGlobalProgress);
    }

    function onSliderDrag(val) {
      if (!showScenes || showScenes.length === 0) return;
      pausePlay();
      const totalTransitions = Math.max(1, showScenes.length - 1);
      currentGlobalProgress = (val / 1000.0) * totalTransitions;
      renderAtProgress(currentGlobalProgress);
    }

    // 圖片轉點陣
    async function convertAndInsertImage() {
      const fileInput = document.getElementById("imageInput");
      const serverUrl = document.getElementById("serverUrl").value.trim().replace(/\/$/, "");
      const droneCount = parseInt(document.getElementById("droneCount").value);
      const imageMode = document.getElementById("imageModeSelect").value;
      const insertTarget = document.getElementById("insertSceneSelect").value;
      const statusBox = document.getElementById("statusBox");
      const promptInput = document.getElementById("promptInput");

      if (!fileInput.files || fileInput.files.length === 0) {
        alert("請先選擇一張圖檔 (PNG 或 JPG)！");
        return;
      }

      if (serverUrl.includes("github.com") || serverUrl.includes("github.io")) {
        statusBox.className = "status-msg error";
        statusBox.innerText = "❌ 伺服器網址不能填寫 GitHub 網址！請點擊右側【雲端】切換至 Render 伺服器。";
        return;
      }

      const file = fileInput.files[0];
      const pureFileName = file.name.replace(/\.[^/.]+$/, "");
      const modeLabel = imageMode === "pixel" ? "像素彩圖" : "線條骨架";
      const sceneKey = `圖形(${modeLabel})：${pureFileName}`;

      const reader = new FileReader();
      reader.onload = async function(e) {
        const base64Data = e.target.result;
        statusBox.className = "status-msg info";
        statusBox.innerText = `⏳ 正在以【${modeLabel}】模式將圖片轉換為點陣...`;

        try {
          const resp = await fetch(`${serverUrl}/api/convert-image-to-drone`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              image_base64: base64Data,
              drone_count: droneCount,
              mode: imageMode,
              scene_name: sceneKey
            })
          });

          if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.detail || "圖片提取失敗");
          }

          const res = await resp.json();
          customImageScenes[sceneKey] = res.scene.points;

          let lines = promptInput.value.trim().split("\n").filter(l => l.trim());
          if (insertTarget === "end") {
            lines.push(sceneKey);
          } else {
            const targetIdx = parseInt(insertTarget) - 1;
            lines.splice(targetIdx, 0, sceneKey);
          }

          const numMap = ["一","二","三","四","五","六","七","八","九","十","十一","十二","十三","十四","十五"];
          const newLines = lines.map((line, idx) => {
            const cleanContent = line.replace(/^第[一二三四五六七八九十\d]+幕[：:]\s*/, "");
            const numStr = idx < numMap.length ? numMap[idx] : (idx + 1);
            return `第${numStr}幕：${cleanContent}`;
          });

          promptInput.value = newLines.join("\n");
          updateInsertSceneOptions();

          statusBox.className = "status-msg success";
          statusBox.innerText = `🎉 已成功將「${sceneKey}」寫入劇本！點擊「✨ 生成 3D 燈光秀」即可展示。`;

        } catch (err) {
          statusBox.className = "status-msg error";
          statusBox.innerText = `❌ ${err.message}`;
        }
      };

      reader.readAsDataURL(file);
    }

    // 發送劇本生成大秀
    async function requestDroneShow() {
      const serverUrl = document.getElementById("serverUrl").value.trim().replace(/\/$/, "");
      const studentName = document.getElementById("studentName").value.trim();
      const droneCount = parseInt(document.getElementById("droneCount").value);
      const prompt = document.getElementById("promptInput").value.trim();
      const apiKey = document.getElementById("apiKeyInput").value.trim();
      const statusBox = document.getElementById("statusBox");
      const submitBtn = document.getElementById("submitBtn");

      if (!prompt) {
        alert("請輸入群飛劇本！");
        return;
      }

      if (serverUrl.includes("github.com") || serverUrl.includes("github.io")) {
        statusBox.className = "status-msg error";
        statusBox.innerText = "❌ 伺服器網址不能填寫 GitHub 網址！\nGitHub / GitHub Pages 僅提供靜態檔案展示，無法執行 Python 運算後端。\n👉 請點擊網址右側的【雲端】按鈕切換為 Render 雲端後端，或點擊【本機】。";
        return;
      }

      statusBox.className = "status-msg info";
      statusBox.innerText = "⏳ 正在召喚 AI 導演理解劇本並計算幾何陣列...";
      submitBtn.disabled = true;
      pausePlay();

      try {
        const resp = await fetch(`${serverUrl}/api/generate-show`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            student_name: studentName,
            drone_count: droneCount,
            prompt: prompt,
            api_key: apiKey || null
          })
        });

        if (!resp.ok) {
          const errData = await resp.json().catch(() => ({}));
          throw new Error(errData.detail || `HTTP 錯誤碼: ${resp.status}`);
        }

        const resData = await resp.json();
        const showData = JSON.parse(resData.data);

        if (!showData.scenes || showData.scenes.length === 0) {
          throw new Error("回傳之場景陣列為空！");
        }

        showScenes = showData.scenes;

        // 套用自訂圖片造型點陣
        for (let scene of showScenes) {
          for (let [imgKey, pts] of Object.entries(customImageScenes)) {
            if (scene.name.includes(imgKey) || imgKey.includes(scene.name)) {
              scene.points = pts;
            }
          }
        }

        // 貪婪配對優化航線
        for (let s = 0; s < showScenes.length - 1; s++) {
          const currentPts = showScenes[s].points;
          const nextPts = showScenes[s + 1].points;
          showScenes[s + 1].points = optimizePairings(currentPts, nextPts);
        }

        currentGlobalProgress = 0.0;
        document.getElementById("totalScenesText").innerText = `共 ${showScenes.length} 幕`;
        
        statusBox.className = "status-msg success";
        statusBox.innerText = `🎉 生成成功！${droneCount} 架無人機已完成立體防撞航線規劃，即刻播放！`;

        renderAtProgress(0.0);
        setTimeout(startPlay, 400);

      } catch (err) {
        console.error(err);
        statusBox.className = "status-msg error";
        statusBox.innerText = `❌ 生成失敗：${err.message}`;
      } finally {
        submitBtn.disabled = false;
      }
    }

    // 匯出 JSON
    function exportShowJSON() {
      if (!showScenes || showScenes.length === 0) {
        alert("尚無可匯出的燈光秀資料，請先生成大秀！");
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
        student: document.getElementById("studentName").value,
        drone_count: parseInt(document.getElementById("droneCount").value),
        created_at: new Date().toISOString(),
        scenes: showScenes
      }, null, 2));
      const dlAnchor = document.createElement("a");
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", `drone_show_${Date.now()}.json`);
      dlAnchor.click();
    }

    // 匯出飛控座標 CSV
    function exportWaypointsCSV() {
      if (!showScenes || showScenes.length === 0) {
        alert("尚無可匯出的燈光秀資料，請先生成大秀！");
        return;
      }
      let csv = "scene_index,scene_name,drone_id,x,y,z,color\n";
      showScenes.forEach((scene, sIdx) => {
        scene.points.forEach((pt, dIdx) => {
          csv += `${sIdx + 1},"${scene.name}",${dIdx + 1},${pt.x},${pt.y},${pt.z},"${pt.color}"\n`;
        });
      });
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const dlAnchor = document.createElement("a");
      dlAnchor.setAttribute("href", url);
      dlAnchor.setAttribute("download", `drone_waypoints_${Date.now()}.csv`);
      dlAnchor.click();
    }
  </script>
